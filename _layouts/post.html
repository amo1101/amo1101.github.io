---
layout: default
---
<article class="post">
  <p><small>{{ page.date | date: "%-d %B %Y" }}</small></p>
  <h1>{{ page.title | escape }}</h1>
  {{ content }}
  {% if page.tags %}
  <p><small>Tags:
    {% for tag in page.tags %}
    <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag | escape }}</a>{% unless forloop.last %} | {% endunless %}
    {% endfor %}
  </small></p>
  {% endif %}
</article>
{% if page.mermaid %}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';

  mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
    const diagram = code.parentElement;
    diagram.classList.add('mermaid');
    diagram.textContent = code.textContent;
  });
  await mermaid.run({ querySelector: 'pre.mermaid' });

  const panZoomScript = document.createElement('script');
  panZoomScript.src = 'https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js';
  await new Promise((resolve, reject) => {
    panZoomScript.onload = resolve;
    panZoomScript.onerror = () => reject(new Error('Failed to load SVG pan/zoom controls.'));
    document.head.append(panZoomScript);
  });
  if (typeof window.svgPanZoom !== 'function') {
    throw new Error('SVG pan/zoom controls were not initialized.');
  }
  document.querySelectorAll('svg[id^="mermaid-"]').forEach((diagram) => {
    window.svgPanZoom(diagram, {
      controlIconsEnabled: true,
      zoomScaleSensitivity: 0.2,
      minZoom: 0.5,
      maxZoom: 10,
      fit: true,
      center: true
    });
  });
</script>
{% endif %}
