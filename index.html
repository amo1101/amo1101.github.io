---
layout: default
title: Home
---

<h2>Latest posts</h2>

{% for post in site.posts %}
<article class="post-preview">
  <h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>
  <p><small>{{ post.date | date: "%B %-d, %Y" }}</small></p>
  {{ post.excerpt }}
</article>
{% endfor %}
